# 产线环境。MySQL 与应用同机时使用 127.0.0.1。长期记忆走腾讯云向量库。
# 激活方式：SPRING_PROFILES_ACTIVE=prod（部署时设置）
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:aimate}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 30000
      max-lifetime: 600000
      idle-timeout: 300000
  jpa:
    show-sql: false

agent:
  llm:
    primary:
      name: gpt-4o
      base-url: ${PRIMARY_LLM_BASE_URL}
      api-key: ${PRIMARY_LLM_API_KEY}
      model: ${PRIMARY_LLM_MODEL:gpt-4o}
      timeout-seconds: 120
    fallback:
      name: deepseek-chat
      base-url: ${FALLBACK_LLM_BASE_URL:https://api.deepseek.com/v1}
      api-key: ${FALLBACK_LLM_API_KEY}
      model: ${FALLBACK_LLM_MODEL:deepseek-chat}
      timeout-seconds: 120
  embedding:
    base-url: ${EMBEDDING_BASE_URL:http://127.0.0.1:11434/v1}
    api-key: ${EMBEDDING_API_KEY:ollama}
    model: ${EMBEDDING_MODEL:bge-m3}
    dimensions: ${EMBEDDING_DIMENSIONS:1024}
    timeout-seconds: 30
  script:
    docker:
      # 产线不再为用户提供独立 Docker 虚拟机；仅系统允许的工具可在服务端执行
      enabled: ${AGENT_SCRIPT_DOCKER_ENABLED:false}
      idle-minutes: 0
      image: debian:bookworm-slim
      memory-limit: 4g
      cpu-limit: 2
      read-only-rootfs: false
      run-container-cmd-timeout-seconds: 300
      run-container-cmd-idle-timeout-seconds: 90
      script-timeout-seconds: 300
      script-idle-timeout-seconds: 90
  vectordb:
    enabled: ${TENCENT_VECTORDB_ENABLED:true}
    url: ${TENCENT_VECTORDB_URL:}
    username: ${TENCENT_VECTORDB_USERNAME:root}
    key: ${TENCENT_VECTORDB_KEY:}
    database: ${TENCENT_VECTORDB_DATABASE:aimate}
    memory-collection: agent_memories
    tool-collection: agent_tools
    embedding-model: ${TENCENT_VECTORDB_MODEL:bge-base-zh}
    vector-dimensions: ${TENCENT_VECTORDB_DIMENSIONS:768}
    timeout-seconds: 30

# AIMATEX Account OIDC + Chat 专用 COS
aimatex:
  platform-code: ${AIMATEX_PLATFORM_CODE:chat}
  oidc:
    enabled: ${AIMATEX_OIDC_ENABLED:true}
    issuer: ${AIMATEX_OIDC_ISSUER:https://account-api.aimatex.com}
    client-id: ${AIMATEX_OIDC_CLIENT_ID:aimatex-chat}
    authorize-url: ${AIMATEX_OIDC_AUTHORIZE_URL:https://account.aimatex.com/oauth/authorize}
    token-url: ${AIMATEX_OIDC_TOKEN_URL:https://account-api.aimatex.com/oauth/token}
    userinfo-url: ${AIMATEX_OIDC_USERINFO_URL:https://account-api.aimatex.com/oauth/userinfo}
    jwks-url: ${AIMATEX_OIDC_JWKS_URL:https://account-api.aimatex.com/oauth/jwks}
    redirect-uri: ${AIMATEX_OIDC_REDIRECT_URI:https://chat.aimatex.com/oauth/callback}
    redirect-uris: ${AIMATEX_OIDC_REDIRECT_URIS:https://chat.aimatex.com/oauth/callback,http://127.0.0.1:5173/oauth/callback,http://localhost:5173/oauth/callback,http://127.0.0.1:19299/oauth/callback}
    scopes: ${AIMATEX_OIDC_SCOPES:openid profile email membership}

# 产线必须通过环境变量设置 JWT 密钥
app:
  jwt:
    secret: ${JWT_SECRET}

logging:
  level:
    com.openforge.aimate: INFO
    org.hibernate.SQL: WARN
